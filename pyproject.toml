[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "var-risk-engine"
version = "0.1.0"
description = "Portfolio Value at Risk engine: Parametric, Historical, and Monte Carlo VaR with optimization and rolling Kupiec POF backtesting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tor" }]

dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "scipy>=1.11,<2.0",
    "matplotlib>=3.8,<4.0",
    "yfinance>=0.2.40,<0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.29",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=var_risk_engine --cov-report=term-missing"

[tool.ruff]
line-length = 110
target-version = "py310"
