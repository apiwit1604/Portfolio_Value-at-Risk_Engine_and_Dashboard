name: Auto Wake Portfolio VaR Dashboard

on:
  schedule:

    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  wake-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Open App & Click Wake Up
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          url = 'https://portfolio-value-at-risk-engine-and-dashboard.streamlit.app/'

          with sync_playwright() as p:
              print('Launching Headless Browser...')
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              
              print(f'Navigating to {url} ...')
              page.goto(url, wait_until='networkidle', timeout=60000)
              time.sleep(10)
              
              wake_button = page.query_selector('button:has-text(\"Yes, get this app back up!\")')
              if wake_button:
                  print('Status: App is sleeping. Clicking wake up button...')
                  wake_button.click()
                  time.sleep(25)
                  print('App status: Successfully triggered Wake Up!')
              else:
                  print('Status: App is already awake and active!')
                  
              browser.close()
          "
